name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
        python: ["3.8", "3.x"]
        exclude:
          - os: macos-15-intel   # no Python 3.8 on the newest runners; Windows still tests it
            python: "3.8"
          - os: ubuntu-latest
            python: "3.8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python -m pip install .
      - run: python -m unittest discover tests
      - run: hamrvis --version
  viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python -m pip install .
      - run: npm install --prefix tests playwright@1.48.2 && npx --prefix tests playwright install --with-deps chromium
      - run: python -m unittest tests.test_viewer_smoke tests.test_viewer_readouts tests.test_viewer_pixels
        env:
          HAMRVIS_REQUIRE_VIEWER_TEST: "1"
